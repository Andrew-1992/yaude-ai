# Training run configuration — phase 1, first fine-tune pass
run_name: "sanadi-coder-v0"

data:
  train_path: "data/processed/train.jsonl"
  eval_path: "data/processed/eval.jsonl"
  max_seq_length: 2048

training:
  output_dir: "checkpoints/sanadi-coder-v0"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 3
  bf16: true
  gradient_checkpointing: true
  report_to: "none" # set to "wandb" once you wire up experiment tracking

# NOTE: these are reasonable starting defaults for a first small-scale run
# (hundreds to low-thousands of examples). Revisit batch size, learning rate,
# and epoch count once the real dataset size is known — don't treat these as final.
